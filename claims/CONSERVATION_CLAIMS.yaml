# Conservation Law Claims — Formal Registry
#
# Machine-readable formal claims for the Conservation Law of Commitment.
# These are the research-layer claims. Search Authority references these
# rather than duplicating them.
#
# Owner: Deric J. McHenry / Ello Cello LLC
# Patent: Serial No. 63/877,177 (Provisional)
# Paper DOI: https://doi.org/10.5281/zenodo.20029607
# Experimental Record DOI: https://doi.org/10.5281/zenodo.19105225
#
# Schema version: 1
# Created: 2026-09-04
# Phase: 3

schema_version: 1

# ---------------------------------------------------------------------------
# Claim status vocabulary (preserved from Framework, NOT collapsed)
# ---------------------------------------------------------------------------
# DEFINED    — true by construction
# DERIVED    — follows logically from definitions
# OBSERVED   — empirical support, not yet replicated
# SUPPORTED  — replicated/scaled evidence
# HYPOTHESIS — testable, insufficient evidence
# SPECULATIVE — not yet testable
# EXTERNAL   — from external literature

claims:

  CL-001:
    statement: >-
      C(T(S)) ≈ C(S) with enforcement — commitment content is conserved
      under governed recursive transformative compression.
    status: OBSERVED
    framework_claim_ref: CT-002
    scope: "Text, code, proofs. 100 sentences, 50 code snippets, 25 proofs."
    evidence_summary: "EXP-001 through EXP-007. 3,950 run entries. 0.94 vs 0.42 stability separation."
    source: "10.5281/zenodo.20029607"
    dependencies: [CL-002, CL-003]

  CL-002:
    statement: >-
      C(T(S)) < C(S) without enforcement — commitment degrades under
      ungoverned recursive transformative compression.
    status: OBSERVED
    framework_claim_ref: CT-003
    scope: "Same as CL-001."
    evidence_summary: "EXP-001 through EXP-007. Drift at n >= 3, consistent at n >= 5."
    source: "10.5281/zenodo.20029607"
    dependencies: []

  CL-003:
    statement: >-
      Commitment C(S) is the minimal identity-preserving deontic invariant
      of a signal.
    status: DEFINED
    framework_claim_ref: CT-001
    scope: "Signals with a definable commitment kernel."
    evidence_summary: "Definition 2.4, v05 paper; P-000 Proposition 1.3."
    source: "10.5281/zenodo.20031715"
    dependencies: []

  CL-004:
    statement: >-
      The conservation law is falsifiable.
    status: DEFINED
    framework_claim_ref: CT-004
    scope: "The protocol is defined; the result is empirical."
    evidence_summary: "v05 paper Section 4."
    source: "10.5281/zenodo.20029607"
    dependencies: []

  CL-005:
    statement: >-
      The conservation law is substrate independent.
    status: DEFINED
    framework_claim_ref: CT-010
    scope: "The law describes a property of the signal and transformation constraints."
    evidence_summary: "P-000 Proposition 5.4."
    source: "10.5281/zenodo.20031715"
    dependencies: []

  CL-006:
    statement: >-
      Semantic entropy is irreversible without external governance.
    status: OBSERVED
    framework_claim_ref: CT-009
    scope: "Ungoverned transformation."
    evidence_summary: "P-000 Proposition 6.3; EXP-001 through EXP-007."
    source: "10.5281/zenodo.20031715"
    dependencies: [CL-002]
